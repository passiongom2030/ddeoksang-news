name: daily-stock-alert

on:
  schedule:
    - cron: "30 6 * * 1-5" # UTC 06:30 = KST 15:30 (장마감 후), 평일만
  workflow_dispatch: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run daily stock alert
        run: npm run daily-alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
